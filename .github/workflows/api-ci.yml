name: API CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resumeforge
          POSTGRES_USER: resumeforge
          POSTGRES_PASSWORD: resumeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeforge -d resumeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resumeforge:resumeforge@localhost:5432/resumeforge
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      APP_URL: http://localhost:3000
      STRIPE_PRO_PRICE_ID: price_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: resumeforge
      S3_SECRET_ACCESS_KEY: resumeforge-local-password
      S3_BUCKET: resumes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

            - name: Start MinIO
        run: |
          docker run -d \
            --name resumeforge-minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=resumeforge \
            -e MINIO_ROOT_PASSWORD=resumeforge-local-password \
            quay.io/minio/minio:latest \
            server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi

            echo "Waiting for MinIO..."
            sleep 2
          done

          echo "MinIO did not become ready"
          docker logs resumeforge-minio
          exit 1

      - name: Run API tests
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build