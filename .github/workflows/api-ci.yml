name: API CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resumeforge
          POSTGRES_USER: resumeforge
          POSTGRES_PASSWORD: resumeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeforge -d resumeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://resumeforge:resumeforge@localhost:5432/resumeforge"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      NODE_ENV: "test"

      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      STRIPE_PRO_PRICE_ID: "price_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      APP_URL: "http://localhost:3000"

      S3_ENDPOINT: "http://localhost:9090"
      S3_ACCESS_KEY_ID: "resumeforge"
      S3_SECRET_ACCESS_KEY: "resumeforge-local-password"
      S3_BUCKET: "resumes"
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Start S3 emulator
        run: |
          docker run -d \
            --name resumeforge-s3 \
            -p 9090:9090 \
            -p 9191:9191 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=resumes \
            adobe/s3mock:latest

      - name: Wait for S3 emulator
        run: |
          ready=0

          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:9090/favicon.ico > /dev/null; then
              ready=1
              echo "S3 emulator is ready"
              break
            fi

            echo "Waiting for S3 emulator..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "S3 emulator did not become ready"
            docker logs resumeforge-s3
            exit 1
          fi

      - name: Run API tests
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build